name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Seed SQL is up to date with packages/catalog
        run: pnpm --filter @serendipity/jobs seed:sql --check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (migrations + seed)
        run: supabase start

      - name: Lint database
        run: supabase db lint

      - name: Smoke explore()/rank_score() against seeded database
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY"
          pnpm --filter @serendipity/jobs smoke
